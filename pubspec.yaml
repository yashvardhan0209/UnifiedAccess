name: unified_access
description: Designed to simplify the integration of multiple authentication methods and notification services within your app.
version: 2.0.1
homepage: https://github.com/yashvardhan0209/UnifiedAccess.git
repository: https://github.com/yashvardhan0209/UnifiedAccess
issue_tracker: https://github.com/yashvardhan0209/UnifiedAccess/issues
topics:
  - firebase
  - authentication
  - notifications
  - fcm
platforms:
  android:
  ios:

environment:
  sdk: ^3.8.0

dependencies:
  device_info_plus: ^12.3.0
  firebase_app_check: ^0.4.2
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  firebase_crashlytics: ^5.1.0
  firebase_messaging: ^16.1.3
  flutter:
    sdk: flutter
  flutter_facebook_auth: ^7.1.6
  flutter_local_notifications: ">=20.1.0 <22.0.0"
  freezed_annotation: ^3.1.0
  google_sign_in: ^7.2.0
  json_annotation: ^4.11.0
  path: ^1.9.1
  the_apple_sign_in: ^1.1.1
  args: ^2.7.0

dev_dependencies:
  build_runner: ^2.13.1
  cidroy_analysis: ^1.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.13.1
  lints: ^6.1.0
  xml: ^6.6.1
